---
name: "sast"

on:
    pull_request:
        branches:
            - "main"
    push:
        branches:
            - "main"
    schedule:
        - cron: "19 19 * * 4"

permissions: "read-all"

jobs:
    ossf:
        runs-on: "ubuntu-latest"
        # ossf scorecard only supported on main branch
        if: github.event_name != 'pull_request'
        permissions:
            security-events: "write"
            id-token: "write"
            contents: "read"
            actions: "read"
        steps:
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false
            - uses: "ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc"
              with:
                  results_file: "results.sarif"
                  results_format: "sarif"
                  publish_results: true
            - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
              with:
                  name: "SARIF file"
                  path: "results.sarif"
                  retention-days: 5
            - uses: "github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd"
              with:
                  sarif_file: "results.sarif"

    codeql:
        runs-on: "ubuntu-latest"

        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
            - uses: "github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd"
              with:
                  languages: "typescript"
            - uses: "pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413"
              with:
                  version: "latest"
            - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"
            - run: "make install"
            - uses: "github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd"
