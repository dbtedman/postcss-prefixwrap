---
name: "sast"

on:
    pull_request:
        branches:
            - "main"
    push:
        branches:
            - "main"
    schedule:
        - cron: "19 19 * * 4"

permissions: "read-all"

jobs:
    ossf:
        runs-on: "ubuntu-latest"
        # ossf scorecard only supported on main branch
        if: github.event_name != 'pull_request'
        permissions:
            security-events: "write"
            id-token: "write"
            contents: "read"
            actions: "read"
        steps:
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
              with:
                  persist-credentials: false
            - uses: "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e"
              with:
                  results_file: "results.sarif"
                  results_format: "sarif"
                  publish_results: true
            - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
              with:
                  name: "SARIF file"
                  path: "results.sarif"
                  retention-days: 5
            - uses: "github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066"
              with:
                  sarif_file: "results.sarif"

    codeql:
        runs-on: "ubuntu-latest"

        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
            - uses: "github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066"
              with:
                  languages: "typescript"
            - uses: "pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115"
              with:
                  version: "latest"
            - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1"
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"
            - run: "make install"
            - uses: "github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066"
